<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Midnight Memories ✦</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:
    radial-gradient(
        circle at 50% 45%,
        #28205c 0%,
        #17163d 32%,
        #0b102b 68%,
        #050817 100%
    );

    color:white;
    font-family:'Montserrat',sans-serif;
}


/* GLOW */

.glow{
    position:fixed;

    width:650px;
    height:650px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(
        circle,
        rgba(142,104,255,.38),
        rgba(81,63,190,.16),
        transparent 70%
    );

    filter:blur(25px);

    pointer-events:none;
}


/* MOON */

.moon{
    position:fixed;

    top:6%;
    right:8%;

    width:78px;
    height:78px;

    border-radius:50%;

    background:#fff9dc;

    box-shadow:
    0 0 20px rgba(255,249,220,.7),
    0 0 60px rgba(255,249,220,.25);
}

.moon::after{
    content:"";

    position:absolute;

    width:75px;
    height:75px;

    border-radius:50%;

    background:#0b102b;

    top:-13px;
    left:24px;
}


/* STARS */

.star{
    position:fixed;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 7px white,
    0 0 15px rgba(180,170,255,.8);

    animation:twinkle 2.5s infinite ease-in-out;
}

.star.big{
    width:5px;
    height:5px;
}

.s1{top:10%;left:8%}
.s2{top:18%;left:24%;animation-delay:.5s}
.s3{top:30%;left:7%;animation-delay:1s}
.s4{top:13%;left:45%;animation-delay:1.4s}
.s5{top:25%;left:64%;animation-delay:.8s}
.s6{top:39%;left:91%;animation-delay:1.8s}
.s7{top:62%;left:8%;animation-delay:.3s}
.s8{top:76%;left:20%;animation-delay:1.1s}
.s9{top:67%;left:84%;animation-delay:.7s}
.s10{top:86%;left:72%;animation-delay:1.6s}
.s11{top:52%;left:95%;animation-delay:.2s}
.s12{top:90%;left:43%;animation-delay:1.3s}

@keyframes twinkle{

    0%,100%{
        opacity:.2;
        transform:scale(.6);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

}


/* SHOOTING STAR */

.shooting-star{

    position:fixed;

    width:120px;
    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.95),
        transparent
    );

    transform:rotate(-35deg);

    top:15%;
    left:-150px;

    animation:shoot 7s linear infinite;
}

@keyframes shoot{

    0%{
        left:-150px;
        top:15%;
        opacity:0;
    }

    10%{
        opacity:1;
    }

    30%{
        left:110%;
        top:65%;
        opacity:0;
    }

    100%{
        left:110%;
        top:65%;
        opacity:0;
    }

}


/* PARTICLES */

.particle{

    position:fixed;

    width:4px;
    height:4px;

    border-radius:50%;

    background:rgba(190,170,255,.65);

    box-shadow:
    0 0 10px rgba(180,160,255,.7);

    animation:
    floatParticle 8s infinite ease-in-out;
}

.p1{left:18%;bottom:10%}
.p2{left:32%;bottom:20%;animation-delay:2s}
.p3{left:75%;bottom:14%;animation-delay:4s}
.p4{left:88%;bottom:28%;animation-delay:1s}
.p5{left:55%;bottom:8%;animation-delay:3s}

@keyframes floatParticle{

    0%,100%{
        transform:translateY(0);
        opacity:.2;
    }

    50%{
        transform:translateY(-80px);
        opacity:.9;
    }

}


/* MAIN */

.container{

    position:relative;

    z-index:5;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:10px;
}

.content{

    width:min(650px,96vw);
}


/* LABEL */

.label{

    display:inline-block;

    padding:6px 18px;

    border:
    1px solid rgba(190,175,255,.3);

    border-radius:50px;

    background:rgba(255,255,255,.04);

    backdrop-filter:blur(10px);

    color:#c9bcff;

    font-size:9px;

    letter-spacing:4px;

    margin-bottom:7px;
}


/* TITLE */

h1{

    font-family:'Cormorant Garamond',serif;

    font-size:
    clamp(34px,7vw,62px);

    line-height:.86;

    font-weight:500;

    letter-spacing:1px;

    color:#f5f1ff;

    text-shadow:
    0 0 25px rgba(161,130,255,.25);
}


/* SCRIPT */

.script{

    font-family:'Great Vibes',cursive;

    font-size:32px;

    color:#bba8ff;

    margin-top:5px;
}


/* DIVIDER */

.divider{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    margin:7px 0;

    color:#a995ff;
}

.divider span{

    width:65px;
    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(171,151,255,.5)
    );
}

.divider span:last-child{

    background:
    linear-gradient(
        90deg,
        rgba(171,151,255,.5),
        transparent
    );
}


/* PHOTO FRAME */

.photo-frame{

    width:min(430px,88vw);

    height:min(540px,62vh);

    margin:0 auto 10px;

    padding:10px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.18),
        rgba(255,255,255,.04)
    );

    border:
    1px solid rgba(255,255,255,.18);

    border-radius:4px;

    box-shadow:
    0 25px 75px rgba(0,0,0,.6),
    0 0 50px rgba(112,85,220,.2);

    transform:rotate(-1deg);

    transition:
    transform .6s ease,
    box-shadow .6s ease;

    backdrop-filter:blur(12px);
}

.photo-frame:hover{

    transform:
    rotate(0deg)
    scale(1.02);

    box-shadow:
    0 30px 85px rgba(0,0,0,.65),
    0 0 65px rgba(130,100,255,.32);
}


/* NORMAL PHOTOS */

.photo{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;

    border:
    1px solid rgba(255,255,255,.08);

    opacity:1;

    transform:scale(1);

    transition:
    opacity .8s ease,
    transform .8s ease;

}


/* PHOTO 4, 6, 7, 8 */

.photo.full-photo{

    object-fit:contain;

    object-position:center center;

    background:#080b20;

}


/* CAPTION */

.caption{

    font-family:'Cormorant Garamond',serif;

    font-size:20px;

    letter-spacing:.5px;

    color:#ded8f4;

    min-height:25px;

    text-shadow:
    0 0 15px rgba(150,130,255,.2);
}


/* PHOTO NUMBER */

.photo-number{

    margin-top:3px;

    font-size:8px;

    letter-spacing:3px;

    color:#aaa2d1;

    opacity:.7;
}


/* BOTTOM */

.bottom{

    margin-top:4px;

    font-size:7px;

    letter-spacing:3px;

    color:#9992bb;

    opacity:.65;
}


/* MOBILE */

@media(max-width:500px){

    .moon{

        width:55px;
        height:55px;

        right:7%;
        top:5%;
    }

    .moon::after{

        width:53px;
        height:53px;

        left:17px;
        top:-9px;
    }

    .photo-frame{

        width:360px;

        height:58vh;
    }

    .script{

        font-size:29px;
    }

    .caption{

        font-size:18px;
    }

    .label{

        font-size:7px;

        letter-spacing:3px;
    }

}

</style>

</head>


<body>


<!-- 🎵 BIRTHDAY MUSIC -->

<audio id="birthdayMusic"
       src="birthday.mp3"
       loop>
</audio>


<div class="glow"></div>

<div class="moon"></div>


<!-- STARS -->

<div class="star s1"></div>
<div class="star s2"></div>
<div class="star s3"></div>
<div class="star s4"></div>
<div class="star s5"></div>

<div class="star big s6"></div>

<div class="star s7"></div>
<div class="star s8"></div>

<div class="star big s9"></div>

<div class="star s10"></div>
<div class="star s11"></div>
<div class="star s12"></div>


<div class="shooting-star"></div>


<!-- PARTICLES -->

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>


<!-- MAIN CONTENT -->

<div class="container">

<div class="content">


<div class="label">
✦ A COLLECTION OF MEMORIES ✦
</div>


<h1>
Moments<br>
To Remember
</h1>


<div class="script">
captured forever... ♡
</div>


<div class="divider">

<span></span>

✦

<span></span>

</div>


<div class="photo-frame">

<img
id="photo"
class="photo"
src="photo1.jpg1.jpg"
alt="Memory">

</div>


<div id="caption" class="caption">
Some moments become forever... ✨
</div>


<div id="photoNumber" class="photo-number">
MEMORY 01 / 10
</div>


<div class="bottom">
ONE MEMORY • ONE MOMENT • FOREVER
</div>


</div>

</div>


<script>


/* =========================
   📸 PHOTO SLIDESHOW
========================= */


const photos = [

{
    image:"photo1.jpg1.jpg",
    text:"Some moments become forever... ✨",
    full:false
},

{
    image:"photo1.jpg2.jpg",
    text:"A beautiful memory worth keeping ♡",
    full:false
},

{
    image:"photo1.jpg3.jpg",
    text:"Little moments, beautiful memories ✦",
    full:false
},

{
    image:"photo1.jpg4.jpg",
    text:"Time passes, memories stay... 🌙",
    full:true
},

{
    image:"photo1.jpg5.jpg",
    text:"One picture, a thousand memories ♡",
    full:false
},

{
    image:"photo1.jpg6.jpg",
    text:"The moments we never want to forget ✨",
    full:true
},

{
    image:"photo1.jpg7.jpg",
    text:"A memory captured in time...",
    full:true
},

{
    image:"photo1.jpg8.jpg",
    text:"Smiles that became memories 💫",
    full:true
},

{
    image:"photo1.jpg9.jpg",
    text:"Some memories are simply special ♡",
    full:false
},

{
    image:"photo1.jpg10.jpg",
    text:"And this moment stays forever... 🌙",
    full:false
}

];


let current = 0;


const photo =
document.getElementById("photo");

const caption =
document.getElementById("caption");

const photoNumber =
document.getElementById("photoNumber");


function changePhoto(){

    /* STOP AFTER PHOTO 10 */

    if(current >= photos.length - 1){

        photo.style.opacity = "0";

        photo.style.transform =
        "scale(1.05)";

        setTimeout(function(){

            window.location.href = "final.html";

        },800);

        return;
    }


    /* FADE OUT */

    photo.style.opacity = "0";

    photo.style.transform =
    "scale(1.05)";


    setTimeout(function(){

        current++;


        /* CHANGE IMAGE */

        photo.src =
        photos[current].image;


        /* CHANGE CAPTION */

        caption.innerHTML =
        photos[current].text;


        /* CHANGE NUMBER */

        const number =
        String(current + 1).padStart(2,"0");


        photoNumber.innerHTML =
        "MEMORY " +
        number +
        " / 10";


        /* FACE CROP FIX */

        if(photos[current].full){

            photo.classList.add(
                "full-photo"
            );

        }
        else{

            photo.classList.remove(
                "full-photo"
            );

        }


        /* FADE IN */

        photo.style.opacity = "1";

        photo.style.transform =
        "scale(1)";


    },800);

}


/* START SLIDESHOW */

setInterval(
    changePhoto,
    4000
);


/* =========================
   🎵 BIRTHDAY MUSIC
========================= */


const birthdayMusic =
document.getElementById(
    "birthdayMusic"
);


/* Music volume */

birthdayMusic.volume = 0.7;


/* Try autoplay */

function startMusic(){

    birthdayMusic.play().catch(
        function(){

            /*
              Browser autoplay block
              pannina first tap/click
              la music start aagum.
            */

            document.addEventListener(
                "click",
                function(){

                    birthdayMusic.play();

                },
                { once:true }
            );

        }
    );

}


/* Start music */

startMusic();


/* =========================
   ❌ PHOTO ERROR
========================= */


photo.addEventListener(
    "error",
    function(){

        photo.style.opacity = "0";

        caption.innerHTML =
        "Please check your photo names ♡";

        photoNumber.innerHTML =
        "PHOTO NOT FOUND";

    }
);


</script>


</body>

</html>
